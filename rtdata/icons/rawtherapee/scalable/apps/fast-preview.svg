  <circle
     id="fastPreviewDisc"
     cx="12"
     cy="12"
     r="9.5"
     fill="#cccccc"
     fill-opacity="1.0"
     opacity="0.9"
     style="stroke:none" />
  <!-- Forward-slanted F. The skew shifts the top of the glyph 3 px to the
       right of the bottom, so the letter leans into its direction of travel.
       The letter is drawn as a solid dark shape rather than a cut-out so it
       stays visible when the toggle button uses its dark checked background. -->
  <path
     id="fastPreviewLetter"
     d="M 8.5,6 H 16 V 9 H 11.5 V 11.5 H 15 V 14.5 H 11.5 V 18 H 8.5 Z"
     transform="matrix(1 0 -0.25 1 3 0)"
     fill="#262626"
     fill-opacity="1.0"
     style="stroke:none" />
  <!-- Two speed streaks trailing the letter inside the disc. -->
  <path
     id="fastPreviewStreaks"
     d="M 3.8,9.3 H 7.0 M 3.4,14.7 H 6.0"
     fill="none"
     stroke="#262626"
     stroke-width="1.4"
     stroke-linecap="butt" />
